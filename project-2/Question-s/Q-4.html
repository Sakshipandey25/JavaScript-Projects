<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Range </title>
</head>
<body>
    
<h1 id="rangeNumber"></h1>
<h1 id="prime"></h1>
    
<script>
let rangeNumber = Number(prompt("Enter the range: "))

for (let num = 1; num <= rangeNumber; num++) {

    let count = 0;

    for (let i = 1; i <= num; i++) {
        if (num % i === 0) {
            count++;
        }
    }

    if (count === 2) {
        document.getElementById("prime").innerHTML += "Prime numbers: " + num + "<br>";
    }
}


</script>
</body>
</html>
