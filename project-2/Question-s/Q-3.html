<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibonacci Series</title>
</head>
<body>

    <h1 id="num"></h1>
    <h1 id="fib"></h1>



    <script>

        let num = Number(prompt("Enter the number of terms: "))
        let a = 0 , b = 1
        fib = a +" " +  b + " "

        for(let i = 3; i <= num; i++ ) {
            let c = a + b
            fib += c + " "
            a = b;
            b = c
        }

        document.getElementById("num").innerText = "You've entered the number is: "+ num
        document.getElementById("fib").innerHTML = "Fibbonacci series: "+ fib

    </script>
    
</body>
</html>
