<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factors</title>
</head>

<body>
    <h1 id="num"></h1>
    <h1 id="factors"></h1>

    <script>
        let num = Number(prompt("Enter a number:"));
        let factors = "";

        for (let i = 1; i <= num; i++) {
            if (num % i === 0) {
                factors += i + " ";
            }
        }

        document.getElementById("num").innerHTML = "Entered Number: " + num;


        document.getElementById("factors").innerHTML = "Factors: " + factors;
    </script>
</body>

</html>
