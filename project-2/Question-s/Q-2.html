<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <h1 id="num"></h1>
    <h1 id="table"></h1>
    

    <script>
        let num = Number(prompt("Enter the Number of Table you want: "))

        let table = ""; 
        
         for(let i = 1; i <= 10; i++) {
            table += num + " x " +  i + " = " + (num * i) + "<br>";
         }

        document.getElementById("num").innerText = "Number you entered: "+ num
        document.getElementById("table").innerHTML = table ;
    


    </script>

</body>
</html>
