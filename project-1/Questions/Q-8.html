<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
</head>

<body>
    <h1>Currency Converter</h1>
    <h3 id=inr></h3>
    <h3 id=fixedRate></h3>
    <h3 id=usd></h3>
    
    <script>
        let fixedRate = 83
        let inr = Number(prompt("Enter INR Amount: "))
        let usd = inr / fixedRate

        document.getElementById("inr").innerText = "Your INR Amount is: " + inr
        document.getElementById("fixedRate").innerText = "Your Fixed Rate is: " + fixedRate
        document.getElementById("usd").innerText = "USD is: " + usd
    </script>

</body>

</html>
