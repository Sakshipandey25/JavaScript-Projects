<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
</head>
<h1>Temperature Converter</h1>
<h3 id="celsius"></h3>
<h3 id="formula"></h3>

<script>
    let celsius = Number(prompt("Enter the celsius: "))
    const formula = (celsius * 9/5) + 32

    document.getElementById("celsius").innerText = "celsius is: "+ celsius
    document.getElementById("formula").innerText = "fahrenheit: "+ formula

</script>
<body>
    
</body>
</html>
