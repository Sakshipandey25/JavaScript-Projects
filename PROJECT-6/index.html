<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz App</title>
<link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

<div class="container">

<!-- Welcome -->
<div id="welcomeBox" class="box">
<h1>Welcome To Quiz</h1>

<input type="text" id="username" placeholder="Enter your name">
<button onclick="startQuiz()">Start Quiz</button>

<p id="error"></p>
</div>

<!-- Countdown -->
<div id="countdownBox" class="box hidden">
<h2>Your Quiz Will Start In</h2>
<h1 id="count">3</h1>
</div>

<!-- Quiz -->
<div id="quizBox" class="box hidden">

<h2 id="question"></h2>

<div class="options">
<button onclick="checkAnswer(0)" id="opt0"></button>
<button onclick="checkAnswer(1)" id="opt1"></button>
<button onclick="checkAnswer(2)" id="opt2"></button>
<button onclick="checkAnswer(3)" id="opt3"></button>
</div>

<button id="nextBtn" onclick="nextQuestion()">Next Question</button>

<p>Time Left: <span id="timer">10</span></p>

</div>

<!-- Result -->
<div id="resultBox" class="box hidden">
<h1 id="resultText"></h1>
<p id="scoreText"></p>
</div>

</div>

<script src="./assets/js/index.js"></script>
</body>
</html>
