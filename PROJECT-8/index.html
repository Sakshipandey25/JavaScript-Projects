<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog App</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <style>
        .breedList {
            overflow-y: auto;
            padding: 10px;
            width: 300px;
        }

        li {
            cursor: pointer;
            margin: 5px 0;
        }

        img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            margin: 5px;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="d-flex">
        <div class="breedList bg-danger vh-100 text-white text-capitalize"></div>

        <div class="p-3 bg-warning text-dark vh-100 vw-100 d-flex flex-wrap" id="imageContainer"></div>
    </div>

    <script>
        const getBreedList = async () => {
            let response = await fetch("https://dog.ceo/api/breeds/list/all");
            let data = await response.json();
            return data.message;
        }

        const getImages = async (breed, subBreed = "") => {
            let url = subBreed
                ? `https://dog.ceo/api/breed/${breed}/${subBreed}/images`
                : `https://dog.ceo/api/breed/${breed}/images`;

            let res = await fetch(url);
            let data = await res.json();
            return data.message;
        }

        const displayImages = (images) => {
            let container = document.getElementById("imageContainer");
            let str = "";

            images.slice(0, 20).forEach(img => {
                str += `<img src="${img}" />`;
            });

            container.innerHTML = str;
        }

        const displayList = async () => {
            let list = await getBreedList();
            let breedList = document.querySelector(".breedList");
            let str = "";

            for (let breed in list) {
                str += `<li onclick="handleClick('${breed}')"><b>${breed}</b></li>`;

                // Sub-breeds
                if (list[breed].length > 0) {
                    list[breed].forEach(sub => {
                        str += `<li style="margin-left:20px;" onclick="handleClick('${breed}','${sub}')">- ${sub}</li>`;
                    });
                }
            }

            breedList.innerHTML = str;
        }

        const handleClick = async (breed, subBreed = "") => {
            let images = await getImages(breed, subBreed);
            displayImages(images);
        }

        displayList();
    </script>
</body>

</html>
